# ---------------------------------------------------------------
# Cardápio Digital — Orquestração de produção (Docker Compose)
# Serviços: db (PostgreSQL) → backend (API) → frontend (nginx).
#
# Variáveis podem ser sobrescritas em um arquivo .env na raiz:
#   POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB / JWT_SECRET /
#   CORS_ORIGIN / VITE_API_BASE_URL
# ---------------------------------------------------------------

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cardapio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardapio_password}
      POSTGRES_DB: ${POSTGRES_DB:-cardapio_digital}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cardapio} -d ${POSTGRES_DB:-cardapio_digital}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-cardapio}:${POSTGRES_PASSWORD:-cardapio_password}@db:5432/${POSTGRES_DB:-cardapio_digital}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obrigatorio. Defina-o no arquivo .env da raiz}
      JWT_EXPIRES_IN: 8h
    ports:
      - "4000:4000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000/api/v1}
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pgdata: