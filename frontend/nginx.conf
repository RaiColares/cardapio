# ---------------------------------------------------------------
# Cardápio Digital — Frontend (produção)
# - Escuta na porta 80 (padrão do nginx:alpine).
# - Serve o build estático da SPA React.
# - Fallback SPA: toda rota que não corresponda a um arquivo real
#   aponta para /index.html (evita 404 ao atualizar a página no React
#   Router, ex.: /menu/slug, /admin/reports).
# ---------------------------------------------------------------
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão para conteúdo textual (o build do Vite já é minificado).
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash no nome (bundles do Vite): cache longo e imutável.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Todas as demais rotas → single-point de entrada da SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}